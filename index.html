<html>
	<head>
		<title>Proptico</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
	</head>
	<body class="is-preload">

		<!-- Header -->
			<header id="header" class="hero"> 
				<h1>Proptico</h1>
				
				<p class="tagline">
				Property management. Simplified.
				</p>
				
				<p class="description">
					A modern property management platform helping landlords and letting agents 
					automate operations, stay compliant, and scale with confidence.
				</p>

				<!-- CTA Button -->
				<button id="waitlistBtn" class="cta-btn">
					Join the waitlist
				</button>
				
				<!--- Hidden Form -->
				<form
					id="waitlistForm"
						action="https://formspree.io/f/mgowzeld" 
						method="POST">
						style="display: none;"
					>
						<input type="text" name="name" placeholder="Full name" required>

 						<input type="email" name="email" placeholder="Email address" required>

  						<input type="tel" name="phone" placeholder="Phone number">

  						<button type="submit" class="cta-btn">
						Submit
						</button>

					</form>
			</header>

		<!-- Signup Form -->

			<form id="signup-form" method="post" action="#" style="display:none;">

				<input type="submit" value="Sign Up" />
			</form>
		-->

		<!-- Footer -->
			<footer id="footer">
				<ul class="copyright">
					<li>&copy; 2025 Proptico.</li><li>
				</ul>
			</footer>

		<!-- Scripts -->
		
  <script>
document.getElementById("waitlistBtn").addEventListener("click", function () {
  document.getElementById("waitlistForm").style.display = "block";
  this.style.display = "none";
});
</script>

	</body>
