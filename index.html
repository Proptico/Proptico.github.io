  <header class="hero">
    <img src="images/proptico-logo.png" alt="Proptico logo" class="logo" />

    <h1 class="tagline">Property management. Simplified.</h1>
    <p class="coming-soon">COMING SOON</p>

    <p class="description">
      Proptico is a modern property management platform designed to give landlords,
      letting agents, and tenants clarity, visibility, and control – all in one place.
    </p>

    <div class="cta-wrapper">
  <button class="cta-btn" onclick="toggleWaitlist()">Join the waitlist</button>
</div>

    <div id="waitlist-form" style="display:block; background: yellow; padding: 20px;">
      <form action="https://formspree.io/f/mgowzeld" method="POST">
        <input type="text" name="name" placeholder="Your name" required style="color:black; background:white; border:2px solid red;" />
        <input type="email" name="email" placeholder="Your email" required />
        <input type="tel" name="phone" placeholder="Your phone number" />
        <button type="submit" class="cta-btn">Submit</button>
      </form>
    </div>

	    <script>
    function toggleWaitlist() {
      const form = document.getElementById('waitlist-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }
  </script>


  <footer id="footer">

  </footer>
